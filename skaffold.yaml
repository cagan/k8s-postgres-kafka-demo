apiVersion: skaffold/v2beta29
kind: Config
metadata:
  name: k8s-postgres-kafka-demo

build:
  local:
    push: false
  artifacts:
    - image: demo-app
      context: .
      jib:
        type: maven
        args:
          - -DskipTests

deploy:
  kubectl:
    manifests:
      - k8s/postgres/*.yaml
      - k8s/kafka/*.yaml
      - k8s/app/*.yaml

portForward:
  - resourceType: service
    resourceName: demo-app
    port: 8080
    localPort: 8080

profiles:
  # Infrastructure only - for local Java development
  - name: infra
    build:
      artifacts: []  # No app build
    deploy:
      kubectl:
        manifests:
          - k8s/postgres/*.yaml
          - k8s/kafka/*.yaml
          - k8s/kafdrop/*.yaml
    portForward:
      - resourceType: service
        resourceName: postgres
        port: 5432
        localPort: 5432
      - resourceType: service
        resourceName: kafka
        port: 9092
        localPort: 9092
      - resourceType: service
        resourceName: kafdrop
        port: 9000
        localPort: 9000
